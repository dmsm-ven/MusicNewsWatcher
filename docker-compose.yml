name: mnwatcher

services:
  api:
    image: painven/mnwatcher_api:latest
    container_name: mnwatcher_api
    restart: unless-stopped
    env_file: "api.env"
    ports:
      - "8050:80"
    environment:
      ASPNETCORE_URLS: http://+:80
    networks:
    - mnwatcher_network
    depends_on:
      - db

  db:
    image: postgres:latest
    container_name: mnwatcher_database
    restart: always
    env_file: "db.env"
    volumes:
      - pgdata:/var/lib/postgresql
    networks:
      - mnwatcher_network

  web-prod:
    build:
      context: ./MusicNewsWatcher.Web
      dockerfile: Dockerfile

    env_file: "web.env"
    ports:
      - "9010:80"
    depends_on:
      - api
    networks:
      - mnwatcher_network
    profiles: ["prod"]

networks:  
  mnwatcher_network:
    name: mnwatcher_network
    external: false

volumes:
  pgdata:
    name: pgdata_mnwatcher
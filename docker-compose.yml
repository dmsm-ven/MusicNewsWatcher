name: mnwatcher

services:
  api:
    container_name: mnwatcher_api
    image: painven/mnwatcher_api:latest
    restart: unless-stopped
    env_file: "api.env"
    ports:
      - "8050:80"
    environment:
      ASPNETCORE_URLS: "http://+:80"
    networks:
      - mnwatcher_network
    depends_on:
      db:
        condition: service_healthy

  db:
    # Версия зафиксирована: при смене major-версии (в том числе через :latest) том с данными перестаёт открываться.
    # Монтирование в /var/lib/postgresql - формат образов PostgreSQL 18+.
    image: postgres:18
    container_name: mnwatcher_database
    restart: always
    env_file: "db.env"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER:-postgres}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - mnwatcher_network

networks:  
  mnwatcher_network:
    name: mnwatcher_network

volumes:
  pgdata:
    name: pgdata_mnwatcher